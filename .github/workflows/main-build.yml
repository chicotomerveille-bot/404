name: "Main Branch Build"

# Builds the Windows x64 installer on every push to main so any commit has a
# downloadable, testable build. 404 ships on Windows only; the upstream
# multi-platform matrix is intentionally trimmed here.
#
# Artifacts are kept for 30 days and can also be built on demand from the
# Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "404"
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
